<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 320 192" role="img" aria-labelledby="title description">
  <title id="title">Midi Mode 2 — two more MIDI CC controls</title>
  <desc id="description">Original routing illustration. Encoder A switches pitch bend to an assigned CC, and encoder B switches aftertouch independently. Six example controller numbers appear below. This is not an Octatrack screenshot.</desc>
  <rect width="320" height="192" rx="12" fill="#202025"/>
  <g fill="none" stroke="#36343f" stroke-width=".6">
    <path d="M20 52H300M20 97H300M20 142H300M64 33V169M128 33V169M192 33V169M256 33V169"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#a5a2b4">
    <text x="24" y="23" fill="#ece8f6" letter-spacing=".7">PB / AT → CC</text>
    <text x="296" y="23" text-anchor="end">MIDI CTRL 1</text>
    <text x="24" y="45">NATIVE</text>
    <text x="116" y="45" text-anchor="middle">CLICK</text>
    <text x="296" y="45" text-anchor="end">ASSIGN</text>
  </g>
  <g fill="#26232f" stroke="#625773" stroke-width=".8">
    <rect x="24" y="56" width="48" height="25" rx="5"/>
    <rect x="24" y="94" width="48" height="25" rx="5"/>
  </g>
  <g fill="none" stroke="#bfb0f8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M73 68.5H103M129 68.5H217M211 64.5L217 68.5 211 72.5"/>
    <path d="M73 106.5H103M129 106.5H217M211 102.5L217 106.5 211 110.5"/>
  </g>
  <g fill="#2b2737" stroke="#bfb0f8" stroke-width=".8">
    <circle cx="116" cy="68.5" r="12"/>
    <circle cx="116" cy="106.5" r="12"/>
    <rect x="225" y="56" width="71" height="25" rx="5"/>
    <rect x="225" y="94" width="71" height="25" rx="5"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" fill="#d7ccfb">
    <g font-size="10">
      <text x="48" y="72">PB</text><text x="48" y="110">AT</text>
      <text x="116" y="72">A</text><text x="116" y="110">B</text>
    </g>
    <g font-size="8.5">
      <text x="260.5" y="72">CC 0–127</text><text x="260.5" y="110">CC 0–127</text>
    </g>
  </g>
  <path d="M24 135H296" stroke="#494151" stroke-width=".7"/>
  <g fill="#26232f" stroke="#625773" stroke-width=".7">
    <rect x="24" y="145" width="37" height="18" rx="4"/><rect x="71" y="145" width="37" height="18" rx="4"/>
    <rect x="118" y="145" width="37" height="18" rx="4"/><rect x="165" y="145" width="37" height="18" rx="4"/>
    <rect x="212" y="145" width="37" height="18" rx="4"/><rect x="259" y="145" width="37" height="18" rx="4"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" text-anchor="middle" fill="#d7ccfb">
    <text x="42.5" y="157">0</text><text x="89.5" y="157">127</text><text x="136.5" y="157">7</text>
    <text x="183.5" y="157">1</text><text x="230.5" y="157">2</text><text x="277.5" y="157">10</text>
  </g>
  <text x="160" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" letter-spacing=".55" fill="#a5a2b4">ASSIGNED CC NUMBERS</text>
</svg>
